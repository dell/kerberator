# One Principal per POSIX UID: binds the UID to a Kerberos principal and
# the Secret holding its keytab. `make quickstart` creates the Secret
# svc-2001-keytab from the demo KDC; for a real KDC see docs/keytabs.md:
#
#   kubectl -n kerberator-demo create secret generic svc-2001-keytab \
#     --from-file=svc-2001.keytab=./svc-2001.keytab
apiVersion: kerberator.dell.com/v1alpha1
kind: Principal
metadata:
  name: svc-2001
  namespace: kerberator-demo
spec:
  uid: 2001
  principal: svc-2001@EXAMPLE.COM
  tenantRef:
    name: demo
  keytabSecretRef:
    name: svc-2001-keytab
    key: svc-2001.keytab
