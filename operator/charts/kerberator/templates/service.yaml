{{- if .Values.service.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kerberator.fullname" . }}-metrics
  labels:
    {{- include "kerberator.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.metrics.type }}
  selector:
    {{- include "kerberator.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.service.metrics.port }}
      targetPort: metrics
      protocol: TCP
{{- end }}